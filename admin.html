<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cloud & Cove — Admin</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { background: #efede5; }
    .admin { max-width: 1080px; margin: 0 auto; padding: 48px 24px 80px; }
    .admin-top { display:flex; align-items:center; justify-content:space-between; margin-bottom:36px; }
    .admin-top h1 { margin:0; font:400 42px "Newsreader", serif; }
    .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-bottom:16px; }
    .stat { background:var(--paper); border:1px solid var(--line); padding:22px; }
    .stat span { display:block; color:#858880; font-size:12px; }
    .stat strong { display:block; margin-top:12px; font:400 32px "Newsreader", serif; }
    .panel { background:var(--paper); border:1px solid var(--line); }
    .panel-head { display:flex; justify-content:space-between; align-items:center; padding:18px 22px; border-bottom:1px solid var(--line); }
    .panel-head h2 { margin:0; font:500 18px "Newsreader", serif; }
    table { width:100%; border-collapse:collapse; }
    th, td { text-align:left; padding:16px 22px; border-bottom:1px solid var(--line); font-size:13px; }
    th { color:#858880; font-size:11px; text-transform:uppercase; letter-spacing:.08em; }
    tr:last-child td { border-bottom:0; }
    .status { display:inline-block; border-radius:20px; padding:6px 9px; background:#e2e7dc; font-size:10px; }
    .admin-link { color:var(--ink); text-decoration:none; font-size:13px; }
    @media (max-width:700px) {
      .stats { grid-template-columns:1fr; }
      table { display:block; overflow-x:auto; }
    }
  </style>
</head>
<body>
  <main class="admin">
    <div class="admin-top">
      <h1>Studio overview</h1>
      <a class="admin-link" href="index.html">← View store</a>
    </div>
    <section class="stats" aria-label="Store statistics">
      <div class="stat"><span>Total revenue</span><strong id="revenue">$0</strong></div>
      <div class="stat"><span>Orders</span><strong id="orders">0</strong></div>
      <div class="stat"><span>Products</span><strong>2</strong></div>
    </section>
    <section class="panel">
      <div class="panel-head"><h2>Recent orders</h2><button class="cart-button" id="refresh" type="button">Refresh</button></div>
      <table>
        <thead><tr><th>Order</th><th>Customer</th><th>Product</th><th>Total</th><th>Status</th></tr></thead>
        <tbody id="orderRows">
          <tr><td>#1048</td><td>Marin L.</td><td>The Tide</td><td>$38</td><td><span class="status">Paid</span></td></tr>
          <tr><td>#1047</td><td>Alex R.</td><td>The Cove</td><td>$42</td><td><span class="status">Paid</span></td></tr>
        </tbody>
      </table>
    </section>
  </main>
  <script>
    document.getElementById("revenue").textContent = "$80";
    document.getElementById("orders").textContent = "2";
    document.getElementById("refresh").addEventListener("click", () => {
      const button = document.getElementById("refresh");
      button.textContent = "Updated";
      setTimeout(() => button.textContent = "Refresh", 1200);
    });
  </script>
</body>
</html>
